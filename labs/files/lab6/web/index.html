<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev on AWS — Items</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #232f3e; }
  h1 { color: #ff9900; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 1rem; }
  input { padding: .4rem; margin: .2rem 0; width: 100%; box-sizing: border-box; }
  button { padding: .4rem .9rem; margin-top: .4rem; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: .3rem; border-bottom: 1px solid #eee; }
  #status { font-family: monospace; white-space: pre-wrap; background: #f4f4f4; padding: .5rem; min-height: 1.5rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>Items</h1>
<p>Static page on S3 → Cognito sign-in → API Gateway (Cognito authorizer) → Lambda → DynamoDB.</p>

<!-- config.js is generated in Lab 6c Step 3: window.APP_CONFIG = {region, clientId, apiUrl} -->
<script src="config.js"></script>

<fieldset id="signin">
  <legend>Sign in (Cognito user pool)</legend>
  <input id="email" type="email" placeholder="alice@example.com" value="alice@example.com">
  <input id="password" type="password" placeholder="password">
  <button id="btnSignIn">Sign in</button>
</fieldset>

<div id="app" class="hidden">
  <p>Signed in as <strong id="who"></strong> · <button id="btnSignOut">Sign out</button></p>
  <fieldset>
    <legend>New item</legend>
    <input id="title" placeholder="title">
    <input id="price" type="number" step="0.01" placeholder="price">
    <button id="btnAdd">Add (POST /items)</button>
  </fieldset>
  <button id="btnList">Refresh (GET /items)</button>
  <table><thead><tr><th>id</th><th>title</th><th>price</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</div>

<h3>Last response</h3>
<div id="status"></div>

<script>
const cfg = window.APP_CONFIG;
const $ = (id) => document.getElementById(id);
let idToken = null;

function show(msg) { $("status").textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2); }
if (!cfg) show("config.js missing — run Lab 6c Step 3 to generate it, then re-sync the site.");

// Cognito's public InitiateAuth API — no AWS credentials needed, just the app client ID
async function signIn(email, password) {
  const r = await fetch(`https://cognito-idp.${cfg.region}.amazonaws.com/`, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-amz-json-1.1",
      "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
    },
    body: JSON.stringify({
      AuthFlow: "USER_PASSWORD_AUTH",
      ClientId: cfg.clientId,
      AuthParameters: { USERNAME: email, PASSWORD: password },
    }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.message || r.status);
  return data.AuthenticationResult.IdToken;
}

function claims(jwt) {
  const p = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  return JSON.parse(atob(p + "=".repeat((4 - p.length % 4) % 4)));
}

// Every API call carries the ID token; the Cognito authorizer validates it
async function api(method, path = "", body) {
  const r = await fetch(cfg.apiUrl + path, {
    method,
    headers: { "Authorization": idToken, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  show({ request: `${method} /items${path}`, status: r.status, body: data });
  if (!r.ok) throw new Error(r.status);
  return data;
}

async function refresh() {
  const data = await api("GET");
  $("rows").innerHTML = "";
  for (const it of data.items) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${it.id ?? ""}</td><td></td><td>${it.price}</td><td><button>Delete</button></td>`;
    tr.children[1].textContent = it.title;
    tr.querySelector("button").onclick = async () => { await api("DELETE", "/" + it.id); refresh(); };
    $("rows").appendChild(tr);
  }
}

$("btnSignIn").onclick = async () => {
  try {
    idToken = await signIn($("email").value, $("password").value);
    const c = claims(idToken);
    $("who").textContent = `${c.email} (sub ${c.sub.slice(0, 8)}…)`;
    $("signin").classList.add("hidden");
    $("app").classList.remove("hidden");
    refresh();
  } catch (e) { show("Sign-in failed: " + e.message); }
};
$("btnSignOut").onclick = () => { idToken = null; $("app").classList.add("hidden"); $("signin").classList.remove("hidden"); };
$("btnList").onclick = refresh;
$("btnAdd").onclick = async () => {
  await api("POST", "", { title: $("title").value, price: parseFloat($("price").value || "0") });
  refresh();
};
</script>
</body>
</html>
