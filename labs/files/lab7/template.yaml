Transform: AWS::Serverless-2016-10-31
Description: Developing on AWS — the Items app as one SAM stack (Lab 7b)

Parameters:
  CognitoPoolId:   { Type: String }
  CognitoClientId: { Type: String }
  UploadsBucket:   { Type: String }

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Tracing: Active
    Timeout: 15

Resources:
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # TableName omitted on purpose — CloudFormation auto-generates a name
      # derived from the stack name (dev-on-aws-userN), keeping it unique per
      # student in the shared account. ItemsFn references it via !Ref.
      # Same pk/sk shape as Items-userN, so the handler code is unchanged.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:            # HTTP APIs answer CORS preflight before the authorizer
        AllowOrigins: ["*"]
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
      Auth:
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience: [!Ref CognitoClientId]
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoPoolId}"
        DefaultAuthorizer: Cognito

  ItemsFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: python/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ItemsTable }
        - S3CrudPolicy:       { BucketName: !Ref UploadsBucket }
        - AWSXRayDaemonWriteAccess
      Environment:
        Variables:
          ITEMS_TABLE:    !Ref ItemsTable
          UPLOADS_BUCKET: !Ref UploadsBucket
      Events:
        Items:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /items
            Method: ANY
        Item:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /items/{id}
            Method: ANY

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
